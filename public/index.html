<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenMarket</title>
<link rel="icon" type="image/png" href="https://wiki.warframe.com/images/thumb/PlatinumLarge.png/300px-PlatinumLarge.png?f57e3" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
    <div class="title-row">
        <img class="logo" src="https://www-static.warframe.com/images/purchase/currency/plat-10120.png" alt="" />
        <h1>OpenMarket</h1>
    </div>
    <p class="subtitle">
        A private shop, priced off real <a href="https://warframe.market" target="_blank" rel="noopener">warframe.market</a> data.
        Not real trading &mdash; buying/selling here self-grants items and platinum via SpaceNinjaServer. Mods, Arcanes, Relics, and Prime Warframe parts/sets.
    </p>
</header>

<main>
    <div class="toolbar">
        <input id="search" type="text" placeholder="Search mods, arcanes, relics, primes..." autocomplete="off" />
        <div id="type-filter" class="filter-group" role="group" aria-label="Filter by type">
            <button class="filter-btn active" data-type="all">All</button>
            <button class="filter-btn" data-type="mod">Mods</button>
            <button class="filter-btn" data-type="arcane">Arcanes</button>
            <button class="filter-btn" data-type="relic">Relics</button>
            <button class="filter-btn" data-type="prime">Primes</button>
        </div>
        <div id="view-toggle" class="filter-group" role="group" aria-label="Switch view">
            <button class="filter-btn active" data-view="list">List</button>
            <button class="filter-btn" data-view="grid">Grid</button>
        </div>
    </div>

    <div class="toolbar toolbar-secondary">
        <select id="sort-select" aria-label="Sort by">
            <option value="default">Sort: Default</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="type">Type</option>
            <option value="owned-desc">Owned (High-Low)</option>
            <option value="owned-asc">Owned (Low-High)</option>
            <option value="price-asc">Price (Low-High)</option>
            <option value="price-desc">Price (High-Low)</option>
        </select>
        <div id="owned-filter" class="filter-group" role="group" aria-label="Filter by ownership">
            <button class="filter-btn active" data-owned="all">All</button>
            <button class="filter-btn" data-owned="owned">Owned</button>
            <button class="filter-btn" data-owned="not-owned">Not Owned</button>
        </div>
        <div id="rarity-filter" class="filter-group" role="group" aria-label="Filter by rarity" hidden>
            <button class="filter-btn active" data-rarity="all">All</button>
            <button class="filter-btn" data-rarity="common">Common</button>
            <button class="filter-btn" data-rarity="uncommon">Uncommon</button>
            <button class="filter-btn" data-rarity="rare">Rare</button>
            <button id="rarity-legendary-btn" class="filter-btn" data-rarity="legendary">Legendary</button>
        </div>
        <div id="era-filter" class="filter-group" role="group" aria-label="Filter by relic era" hidden>
            <button class="filter-btn active" data-era="all">All</button>
            <button class="filter-btn" data-era="lith">Lith</button>
            <button class="filter-btn" data-era="meso">Meso</button>
            <button class="filter-btn" data-era="neo">Neo</button>
            <button class="filter-btn" data-era="axi">Axi</button>
            <button class="filter-btn" data-era="requiem">Requiem</button>
        </div>
    </div>

    <div class="status-row">
        <div id="status" class="status"></div>
        <div id="price-loading" class="price-loading" hidden>Loading prices&hellip;</div>
    </div>
    <div id="mod-list" class="mod-list"></div>

    <div id="pagination" class="pagination">
        <button id="prev-page" class="btn btn-page">&larr; Prev</button>
        <span id="page-indicator"></span>
        <button id="next-page" class="btn btn-page">Next &rarr;</button>
    </div>
</main>

<div id="toast-container"></div>

<div id="icon-preview" class="icon-preview" hidden>
    <img id="icon-preview-img" src="" alt="" />
</div>

<template id="mod-row-template">
    <div class="mod-row">
        <div class="icon-wrap">
            <img class="mod-icon" src="" alt="" />
            <span class="slot-badge" hidden></span>
        </div>
        <div class="mod-info">
            <div class="mod-name"></div>
            <div class="owned-count" hidden></div>
            <button class="owned-ranks-toggle" type="button" hidden></button>
            <div class="rank-stepper" hidden>
                <button class="rank-btn rank-minus" type="button" aria-label="Decrease rank">&minus;</button>
                <span class="rank-value">Rank 0</span>
                <button class="rank-btn rank-plus" type="button" aria-label="Increase rank">&plus;</button>
            </div>
        </div>
        <div class="mod-price">&hellip;</div>
        <button class="btn btn-buy">Buy</button>
        <button class="btn btn-sell">Sell</button>
    </div>
</template>

<script src="app.js"></script>
</body>
</html>
